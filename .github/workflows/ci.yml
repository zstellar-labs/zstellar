name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run Biome lint
        working-directory: frontend
        run: pnpm lint

      - name: Check for forbidden console.log in src/
        run: |
          ALLOWLIST="frontend/src/app/api/rpc/route.ts"
          echo "Checking frontend/src for console.log calls (allowlisted: $ALLOWLIST)..."
          MATCHES=$(grep -rnE "console\.log\s*\(" frontend/src | grep -v "^${ALLOWLIST}:" || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Found forbidden console.log statements in frontend/src:"
            echo "$MATCHES"
            exit 1
          fi
          echo "Clean: No forbidden console.log found."

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build Next.js app
        working-directory: frontend
        run: pnpm build

name: CI

# Build/lint every push and pull request (issue #29). `permissions` is scoped to
# the read-only token the jobs need (issue #32) and every action is pinned to a
# full commit SHA (issue #33).
on:
  push:
  pull_request:

permissions:
  contents: read

# One run per ref; a newer push cancels the older run (issue #34).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    # Bounded well below the 360-minute GitHub default (issue #35).
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          # Minimum supported major, matching frontend/package.json `engines`.
          node-version: 20
          # Cache the pnpm store keyed on the committed lockfile (issue #36).
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile

      # `biome ci` is the non-interactive, never-writes verb (issue #40).
      - name: Biome CI (lint, imports, format)
        run: pnpm exec biome ci .

      # Explicit format check that never rewrites the tree (issue #41).
      - name: Biome format check
        run: pnpm exec biome format .

      # No new console.log may land in the shipped source (issue #103).
      - name: Fail on stray console.log in src
        run: |
          echo "Scanning frontend/src for console.log(...)"
          all_matches=$(grep -rn --include='*.ts' --include='*.tsx' --include='*.js' 'console\.log(' src || true)
          # Explicit, file-scoped allowlist for pre-existing logs:
          #   - api/rpc/route.ts keeps deliberate server-side proxy diagnostics.
          #   - engine/vendor/wallet.js' two signMessage logs are removed by #66.
          matches=$(printf '%s\n' "$all_matches" | grep -vE '^src/(app/api/rpc/route\.ts|engine/vendor/wallet\.js):' || true)
          if [ -n "$matches" ]; then
            echo "Found console.log( in frontend/src:"
            printf '%s\n' "$matches"
            exit 1
          fi
          echo "No stray console.log( found."

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # A lockfile that drifted from package.json fails right here (issues #29, #101).
      - name: Install dependencies (frozen lockfile)
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Repo-specific guard for a live relayer secret seed (issue #102).
      - name: Fail on a committed RELAYER_SECRET value
        run: |
          echo "Scanning tracked files for Stellar secret seeds"
          # Only tracked files are scanned, so the gitignored .env.local is never
          # read. Documentation placeholders (*.md, *.txt, *.example) and this
          # workflow are excluded.
          matches=$(git grep -nIE 'RELAYER_SECRET=S[A-Z0-9]{55}|\bS[A-Z2-7]{55}\b' -- . \
            ':(exclude).github' ':(exclude)*.md' ':(exclude)*.txt' ':(exclude)*.example' || true)
          if [ -n "$matches" ]; then
            echo "A Stellar secret seed appears to be committed:"
            printf '%s\n' "$matches"
            exit 1
          fi
          echo "No committed RELAYER_SECRET values found."

  docs-drift:
    name: docs-drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # README must list every CONTRACTS address from config.ts (issue #42).
      - name: Verify README contract addresses match config.ts
        run: |
          node --input-type=module -e '
          import { readFileSync } from "node:fs";
          const config = readFileSync("frontend/src/lib/stellar/config.ts", "utf8");
          const addresses = [...config.matchAll(/"([CG][A-Z2-7]{55})"/g)].map((match) => match[1]);
          if (addresses.length !== 6) {
            console.error("Expected 6 CONTRACTS addresses in config.ts, found " + addresses.length);
            process.exit(1);
          }
          const readme = readFileSync("README.md", "utf8");
          const missing = addresses.filter((address) => !readme.includes(address));
          if (missing.length > 0) {
            console.error("README.md is missing CONTRACTS addresses: " + missing.join(", "));
            process.exit(1);
          }
          console.log("README.md lists all " + addresses.length + " CONTRACTS addresses.");
          '

  headers:
    name: headers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile

      # COOP/COEP and the /engine no-store header are load-bearing for
      # SharedArrayBuffer/OPFS; a regression must fail CI (issue #46).
      - name: Build, start and verify the cross-origin headers
        timeout-minutes: 15
        run: |
          pnpm build
          pnpm start > /tmp/next-start.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=""
          for attempt in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/; then
              ready="yes"
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "next start did not become ready"
            cat /tmp/next-start.log
            exit 1
          fi

          root_headers=$(curl -sSI http://localhost:3000/)
          printf '%s\n' "$root_headers"
          printf '%s\n' "$root_headers" | grep -qi 'cross-origin-opener-policy: same-origin'
          printf '%s\n' "$root_headers" | grep -qi 'cross-origin-embedder-policy: require-corp'

          engine_headers=$(curl -sSI http://localhost:3000/engine/js/web.js)
          printf '%s\n' "$engine_headers"
          printf '%s\n' "$engine_headers" | grep -qi 'cache-control: no-store'

          echo "COOP/COEP and the /engine no-store header are intact."

  # Single terminal gate: branch protection should require only `ci-ok` so a
  # renamed, conditional, or skipped job cannot leave the PR green (issue #39).
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - lint
      - build
      - secret-scan
      - docs-drift
      - headers
    steps:
      - name: Verify every required job succeeded
        run: |
          results="${{ join(needs.*.result, ',') }}"
          echo "Job results: ${results}"
          case ",${results}," in
            *failure*|*cancelled*|*skipped*)
              echo "At least one required job did not succeed."
              exit 1
              ;;
            *success*)
              ;;
            *)
              echo "No job results were reported."
              exit 1
              ;;
          esac
          echo "All required jobs succeeded."
